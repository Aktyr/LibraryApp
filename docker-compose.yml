services:
  postgres:
    image: postgres:16-alpine
    container_name: libapp-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: libapp
    volumes:
      - libapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP-ловушка для локальной разработки. Запускается только с профилем dev:
  #   docker compose --profile dev up
  # Веб-интерфейс: http://localhost:3000, SMTP-порт на хосте: 2525.
  # Порты проброшены только на 127.0.0.1 — снаружи недоступны.
  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: libapp-smtp4dev
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
      - "127.0.0.1:2525:2525"
    environment:
      # Внутри контейнера smtp4dev слушает 2525 вместо дефолтного 25.
      # Причина: на Windows Docker Desktop проброс порта 25 через WSL2
      # работает нестабильно — соединение есть, EHLO не доходит.
      ServerOptions__Port: "2525"
    volumes:
      - smtp4dev-data:/smtp4dev

  webapi:
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    container_name: libapp-webapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=libapp;Username=postgres;Password=postgres"
      ApplicationSettings__Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ApplicationSettings__Jwt__Issuer: LibraryApp
      ApplicationSettings__Jwt__Audience: LibraryApp
      ApplicationSettings__Jwt__ExpiryMinutes: 60

      # SMTP-ловушка. dev:dev — smtp4dev не проверяет credentials, но
      # EmailNotificationService требует непустой SmtpUsername, иначе отсеивает
      # письмо до коннекта. Для production — заменить env на реальные креды
      # провайдера (SMTP.BZ, Yandex Cloud Postbox и т.п.).
      ApplicationSettings__Notification__SmtpServer: smtp4dev
      ApplicationSettings__Notification__SmtpPort: 25
      ApplicationSettings__Notification__SmtpUsername: "dev"
      ApplicationSettings__Notification__SmtpPassword: "dev"
      ApplicationSettings__Notification__FromEmail: noreply@example.com
      ApplicationSettings__Notification__Enabled: ${NOTIFICATION_ENABLED:-false}
    ports:
      - "5096:8080"

  blazorweb:
    build:
      context: .
      dockerfile: BlazorWeb/BlazorWeb/Dockerfile
    container_name: libapp-blazorweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      webapi:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=libapp;Username=postgres;Password=postgres"
      ApiBaseUrl: "http://webapi:8080/"
      ApplicationSettings__Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ApplicationSettings__Jwt__Issuer: LibraryApp
      ApplicationSettings__Jwt__Audience: LibraryApp
      ApplicationSettings__Jwt__ExpiryMinutes: 60
      Seed__AdminEmail: admin@library.local
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Seed__AdminLastName: Administrator
      Seed__AdminFirstName: System
    ports:
      - "5271:8080"

volumes:
  libapp-pgdata:
    name: libapp-pgdata
  smtp4dev-data:
    name: libapp-smtp4dev-data
